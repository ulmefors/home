
title: marcus ulmefors
# Appended after the site title in the <title> tag on the home page, and used as the
# fallback meta description everywhere a page does not define its own.
tagline: "Talks, publications, and writing on batteries, cloud, and machine learning"
description: >-
  Personal site of Marcus Ulmefors with talks, publications, and writing on Li-ion
  batteries, gigafactory cloud architecture, data science, and machine learning.

# Used by jekyll-seo-tag for the author in the JSON-LD structured data of every post.
# Site level only, so post bylines in the layout are unaffected.
author:
  name: Marcus Ulmefors
  url: "https://ulmefors.com/about/"

# Feeds the schema.org "sameAs" links and the entity name on the home and about pages.
social:
  name: Marcus Ulmefors
  links:
    - "https://www.linkedin.com/in/ulmefors/"
    - "https://github.com/ulmefors"

# Publisher logo in the JSON-LD structured data.
logo: /images/logo.png

# <html lang> and og:locale
lang: en
locale: en_US

# you can comment the below line out if your repo name is not different than your baseurl
github_repo: "home"

# OPTIONAL: override baseurl and url if using a custom domain
# Note: leave out the trailing / from this value.
url: "https://ulmefors.com" # "https://ulmefors.github.io" # the base hostname & protocol for your site, e.g. http://example.com

###########################################################
#########  Special Instructions for baseurl ###############
#
#### Scenario One: If you do not have a Custom Domain #####
#    -  if you are not using a custom domain, the baseurl *must* be set to your repo name
#
####  Scenario Two: If you have a Custom Domain #####
# 1. If your domain does NOT have a subpath, this leave this value as ""
# 2. If your domain does have a subpath, you must preceed the value with a / and NOT have a / at the end.  
#      For example:
#           "" is valid
#           "/blog"        is valid
#            "/blog/site/" is invalid  ( / at the end)
#            "/blog/site"  is valid
#            "blog/site"   is invalid  ( because doesn't begin with a /)
#
# 3. You must replace the parameter `baseurl` in _action_files/settings.ini with the same value as you set here but WITHOUT QUOTES.
#
baseurl: "" # "/home" # the subpath of your site, e.g. "/blog".

# Github and twitter are optional:
# ISO date format instead of US convention
minima:
  date_format: "%Y-%m-%d"  # Reference https://github.com/jekyll/minima/blob/master/README.md#change-default-date-format

  social_links:
    - title: LinkedIn
      icon: linkedin
      url: "https://www.linkedin.com/in/ulmefors/"
    - title: GitHub
      icon: github
      url: "https://github.com/ulmefors"
  hide_site_feed_link: true

# Set this to true to get LaTeX math equation support
use_math:

# Set this to true to display the summary of your blog post under your title on the Home page.
show_description: true

# Set this to true to display image previews on home page, if they exist
show_image: true

# Set this to true to turn on annotations with hypothes.is (https://web.hypothes.is/)
annotations: false

# Set this to true to display tags on each post
show_tags: true

# Add your Google Analytics ID here if you have one and want to use it
google_analytics:

# Add your domain if you have Plausible Analytics and want to use it
plausible_analytics: ulmefors.com

# Files that should not be copied into the built site. Jekyll appends its own
# defaults (Gemfile, vendor/, node_modules/, ...) to this list.
exclude:
  - docker-compose.yml
  - action.yml
  - Makefile
  - README.md
  - LICENSE
  - CLAUDE.md

# this setting allows you to keep pages organized in the _pages folder
include:
  - _pages

# Fallback social preview image so every page has an og:image / twitter:image.
# Any page or post that sets `image` in its front matter overrides this.
defaults:
  - scope:
      path: ""
    values:
      image: /images/logo.png

# This specifies what badges are turned on by default for notebook posts.
default_badges:
  github: true
  binder: true
  colab: true

# Escape HTML in post descriptions
html_escape:
  description: false

# Everything below here should be left alone. Modifications may break fastpages
future: true
theme: minima

titles_from_headings:
  enabled:     true
  strip_title: true
  collections: true

highlighter: rouge
markdown: kramdown
kramdown:
  math_engine: katex
  input: GFM
  auto_ids: true
  hard_wrap: false
  syntax_highlighter: rouge

# to limit size of xml as it can grow quite large.
feed:
  posts_limit: 5 #default posts_limit: 10
  excerpt_only: true

sass:
  quiet_deps: true
  silence_deprecations:
    - import
