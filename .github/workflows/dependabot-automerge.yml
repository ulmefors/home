name: Dependabot Auto-merge

# Runs after the CI workflow finishes, so a Dependabot PR is merged only once
# its site build has passed. A failed or cancelled build leaves the PR open.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    steps:
      - name: Merge Dependabot PR
        run: |
          pr=$(gh pr view "$HEAD_BRANCH" --repo "$REPO" --json number,author,state,baseRefName \
            --jq 'select((.author.login | test("dependabot")) and .state == "OPEN" and .baseRefName == "master") | .number')
          if [ -z "$pr" ]; then
            echo "No open Dependabot PR into master for $HEAD_BRANCH; nothing to merge."
            exit 0
          fi
          # Only merge the exact commit CI built; a newer push gets its own CI run.
          gh pr merge "$pr" --repo "$REPO" --squash --match-head-commit "$HEAD_SHA"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
